
<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anti-Bot Test</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
height:100vh;
overflow:hidden;
font-family:Arial,sans-serif;
background:
radial-gradient(circle at top,#ff0055 0%,transparent 35%),
radial-gradient(circle at bottom,#7c3aed 0%,transparent 40%),
#09090f;
display:flex;
justify-content:center;
align-items:center;
color:white;
text-align:center;
}

.screen{
width:min(90vw,800px);
position:relative;
z-index:2;
}

h1{
font-size:clamp(40px,7vw,88px);
margin-bottom:12px;
}

p{
font-size:22px;
opacity:.9;
}

#btn{
position:absolute;
left:50%;
top:65%;
transform:translate(-50%,-50%);
padding:20px 34px;
border:none;
border-radius:999px;
background:white;
color:black;
font-size:24px;
font-weight:bold;
cursor:pointer;
transition:.12s;
box-shadow:0 20px 60px rgba(0,0,0,.5);
}

#btn:hover{
transform:translate(-50%,-50%) scale(1.08) rotate(-5deg);
}

.popup{
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
background:rgba(0,0,0,.72);
backdrop-filter:blur(8px);
z-index:10;
padding:20px;
}

.card{
width:min(94vw,560px);
background:white;
color:black;
padding:32px;
border-radius:30px;
box-shadow:0 0 80px rgba(255,0,80,.35);
animation:pop .25s ease;
}

@keyframes pop{
from{transform:scale(.8);opacity:0}
to{transform:scale(1);opacity:1}
}

.card h2{
margin-top:0;
font-size:32px;
}

.card p{
color:#555;
font-size:18px;
}

input{
width:100%;
padding:16px;
margin-top:16px;
border-radius:16px;
border:2px solid #ddd;
font-size:20px;
text-align:center;
}

button.action{
margin-top:16px;
width:100%;
padding:15px;
border:none;
border-radius:16px;
background:#7c3aed;
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
transition:.14s;
}

button.action:hover{
transform:scale(1.03);
}

#reply{
min-height:34px;
margin-top:18px;
font-size:18px;
font-weight:bold;
color:#7c3aed;
}

.crash{
position:fixed;
inset:0;
background:black;
display:none;
z-index:999;
overflow:hidden;
}

.glitch{
position:absolute;
top:20%;
left:50%;
transform:translateX(-50%);
font-size:clamp(40px,8vw,100px);
font-weight:bold;
color:#ff003c;
animation:glitch .08s infinite alternate;
text-shadow:4px 0 #00e5ff;
}

@keyframes glitch{
from{transform:translateX(-50%) translate(-4px,1px)}
to{transform:translateX(-50%) translate(4px,-1px)}
}

.terminal{
position:absolute;
left:50%;
top:45%;
transform:translateX(-50%);
width:min(92vw,760px);
font-family:Consolas,monospace;
color:#00ff7f;
font-size:18px;
text-align:left;
line-height:1.7;
}

.scan{
position:absolute;
inset:0;
background:repeating-linear-gradient(
to bottom,
rgba(255,255,255,.04),
rgba(255,255,255,.04) 2px,
transparent 2px,
transparent 5px
);
pointer-events:none;
animation:flicker .08s infinite alternate;
}

@keyframes flicker{
from{opacity:.3}
to{opacity:.55}
}

.fake{
position:fixed;
width:18px;
height:18px;
border:2px solid white;
border-radius:50%;
pointer-events:none;
animation:click .6s ease forwards;
z-index:999;
}

@keyframes click{
to{
transform:scale(4);
opacity:0;
}
}

.shake{
animation:shake .12s linear 4;
}

@keyframes shake{
0%,100%{transform:translateX(0)}
25%{transform:translateX(-10px)}
75%{transform:translateX(10px)}
}
</style>
</head>

<body>

<div class="screen">
<h1>KLICK MICH 😇</h1>
<p>Beweise, dass du kein Bot bist.</p>
</div>

<button id="btn">Ich bin kein Bot</button>

<div class="popup" id="popup">
<div class="card" id="card">
<h2 id="title"></h2>
<p id="desc"></p>

<div id="inputArea"></div>

<p id="reply"></p>

<button class="action" id="checkBtn">Prüfen</button>
<button class="action" id="nextBtn" style="display:none">Weiter</button>
</div>
</div>

<div class="crash" id="crash">
<div class="scan"></div>
<div class="glitch">DU BIST EIN BOT</div>
<div class="terminal" id="terminal"></div>
</div>

<script>

const btn=document.getElementById("btn");
const popup=document.getElementById("popup");
const card=document.getElementById("card");
const title=document.getElementById("title");
const desc=document.getElementById("desc");
const inputArea=document.getElementById("inputArea");
const reply=document.getElementById("reply");
const checkBtn=document.getElementById("checkBtn");
const nextBtn=document.getElementById("nextBtn");
const crash=document.getElementById("crash");
const terminal=document.getElementById("terminal");

let escapes=0;
let stage=0;

let ageFails=0;
let animeFails=0;

function moveButton(){
escapes++;

const x=Math.random()*(window.innerWidth-btn.offsetWidth-40);
const y=Math.random()*(window.innerHeight-btn.offsetHeight-40);

btn.style.left=x+"px";
btn.style.top=y+"px";

if(escapes>=5){
startQuestions();
}
}

btn.addEventListener("mouseenter",moveButton);
btn.addEventListener("click",moveButton);

function fakeClick(){
const c=document.createElement("div");
c.className="fake";
c.style.left=Math.random()*window.innerWidth+"px";
c.style.top=Math.random()*window.innerHeight+"px";
document.body.appendChild(c);

setTimeout(()=>c.remove(),600);
}

setInterval(fakeClick,900);

function startQuestions(){
if(popup.style.display==="flex") return;
btn.style.display="none";
popup.style.display="flex";
loadQuestion();
}

function loadQuestion(){

reply.textContent="";
checkBtn.style.display="block";
nextBtn.style.display="none";

if(stage===0){
title.textContent="Bro du hast NIE getroffen 😭";
desc.textContent="Okay komm rein. Erste Sicherheitsfrage.";
inputArea.innerHTML='<input id="answer" placeholder="Wie alt bist du?">';
setTimeout(()=>document.getElementById("answer").focus(),50);
}

if(stage===1){
title.textContent="Noch eine Frage";
desc.textContent="Was ist dein Lieblingsessen?";
inputArea.innerHTML='<input id="answer" placeholder="Lieblingsessen...">';
setTimeout(()=>document.getElementById("answer").focus(),50);
}

if(stage===2){
title.textContent="Letzte Frage";
desc.textContent="Lieblingsanime?";
inputArea.innerHTML='<input id="answer" placeholder="Anime...">';
setTimeout(()=>document.getElementById("answer").focus(),50);
}
}

document.addEventListener("keydown",(e)=>{
if(e.key==="Enter" && popup.style.display==="flex" && checkBtn.style.display!=="none"){
checkBtn.click();
}
});

checkBtn.onclick=()=>{

const value=document.getElementById("answer").value.trim().toLowerCase();

if(stage===0){

if(value==="30"){
reply.textContent="Wusste ich doch.";
nextBtn.style.display="block";
checkBtn.style.display="none";
return;
}

ageFails++;

card.classList.add("shake");
setTimeout(()=>card.classList.remove("shake"),500);

if(ageFails===1){
reply.textContent="Falsch.";
}

else if(ageFails===2){
reply.textContent="Bro… denk älter.";
}

else{
reply.textContent="Hinweis: 30. Okay, ich lass dich trotzdem weiter.";
nextBtn.style.display="block";
checkBtn.style.display="none";
}

}

if(stage===1){

if(value.includes("cig") || value.includes("çiğ")){
reply.textContent="Cigköfte? Du absoluter Endgegner 😭";
}
else if(value.includes("salat")){
reply.textContent="Hör auf zu lügen.";
}
else{
reply.textContent="NPC-Essen erkannt.";
}

nextBtn.style.display="block";
checkBtn.style.display="none";
}

if(stage===2){

if(value==="naruto"){
reply.textContent="Okay… wenigstens EIN bisschen Geschmack.";
nextBtn.style.display="block";
checkBtn.style.display="none";
return;
}

animeFails++;

card.classList.add("shake");
setTimeout(()=>card.classList.remove("shake"),500);

if(animeFails===1){
reply.textContent="Das ist kein Geschmack.";
}

else if(animeFails===2){
reply.textContent="Bro wirklich?";
}

else{
reply.textContent="Hinweis: 🍥🥷🦊🍜 Okay, weiter. Das tut weh.";
nextBtn.style.display="block";
checkBtn.style.display="none";
}

}
};

nextBtn.onclick=()=>{

stage++;

if(stage>2){
startCrash();
}
else{
loadQuestion();
}
};

function startCrash(){

popup.style.display="none";
crash.style.display="block";

const lines=[
"> BOT ERKANNT...",
"> Lieblingsessen analysiert...",
"> Anime-Geschmack katastrophal...",
"> Discord Token gefunden...",
"> Fortnite-Skins werden verkauft...",
"> Mutter wird kontaktiert...",
"> Menschlichkeit: 2%",
"> Ergebnis: DU BIST EIN BOT",
"> Bildschirm wird zerstört..."
];

let i=0;

const inter=setInterval(()=>{

terminal.innerHTML+=lines[i]+"<br>";
i++;

if(i>=lines.length){

clearInterval(inter);

setTimeout(()=>{
terminal.innerHTML+="<br><br>SPAß 😭";
},1500);

}

},650);

}

</script>

</body>
</html>
