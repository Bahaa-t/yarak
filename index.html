<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Klick auf mich</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1d1b3a, #4d1f5c, #ff7a59);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .screen {
      width: min(90vw, 700px);
      padding: 32px;
    }

    h1 {
      font-size: clamp(32px, 7vw, 68px);
      margin: 0 0 12px;
    }

    p {
      font-size: 20px;
      opacity: 0.9;
    }

    #trollButton {
      position: absolute;
      left: 50%;
      top: 60%;
      transform: translate(-50%, -50%);
      padding: 18px 32px;
      border: none;
      border-radius: 999px;
      background: white;
      color: #2b1640;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      transition: left 0.16s ease, top 0.16s ease, transform 0.12s ease;
    }

    #trollButton:hover {
      transform: translate(-50%, -50%) rotate(-4deg) scale(1.05);
    }

    .popup {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(8px);
      z-index: 10;
    }

    .card {
      width: min(92vw, 520px);
      padding: 28px;
      border-radius: 28px;
      background: white;
      color: #241136;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
      animation: pop 0.35s ease;
    }

    @keyframes pop {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .card h2 {
      margin-top: 0;
      font-size: 30px;
    }

    .card p {
      color: #4d3a5c;
      font-size: 18px;
    }

    .choices {
      display: grid;
      gap: 12px;
      margin-top: 20px;
    }

    .choices button, #nextButton {
      border: none;
      border-radius: 18px;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #7c3aed;
      color: white;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .choices button:hover, #nextButton:hover {
      transform: scale(1.04);
    }

    #answerText {
      min-height: 28px;
      margin-top: 18px;
      font-weight: bold;
      color: #7c3aed;
    }

    #nextButton {
      margin-top: 16px;
      display: none;
      background: #ff5c7a;
    }
  </style>
</head>
<body>
  <main class="screen">
    <h1>Klick auf mich 😇</h1>
    <p>Keine Sorge, ich bin ein ganz normaler Button. Wirklich.</p>
  </main>

  <button id="trollButton">Hier klicken</button>

  <section class="popup" id="popup">
    <div class="card" id="card">
      <h2 id="questionTitle">Ja, ich weiß…</h2>
      <p id="questionText">Du hast nie getroffen. Nicht einmal knapp. Aber hey, ich fühle dich.</p>

      <div class="choices" id="choices"></div>
      <p id="answerText"></p>
      <button id="nextButton">Weiter</button>
    </div>
  </section>

  <script>
    const btn = document.getElementById("trollButton");
    const popup = document.getElementById("popup");
    const questionTitle = document.getElementById("questionTitle");
    const questionText = document.getElementById("questionText");
    const choices = document.getElementById("choices");
    const answerText = document.getElementById("answerText");
    const nextButton = document.getElementById("nextButton");

    let escapes = 0;
    let questionIndex = -1;

    const questions = [
      {
        title: "Frage 1: Wie fühlst du dich gerade?",
        text: "Nach all diesen verfehlten Klicks interessiert mich das wirklich. Ein bisschen.",
        answers: [
          { label: "Stabil, aber innerlich kaputt", reply: "Verständlich. Der Button hat dich emotional gedribbelt." },
          { label: "Ich habe alles unter Kontrolle", reply: "Natürlich. Deswegen bist du auch hier gelandet." },
          { label: "Ich fühle den Button später", reply: "Der Button hat Angst. Aber nur minimal." }
        ]
      },
      {
        title: "Frage 2: Was ist dein nächster Move?",
        text: "Wähle weise. Oder halt einfach irgendwas.",
        answers: [
          { label: "Nochmal versuchen", reply: "Mutig. Dumm, aber mutig." },
          { label: "Ich rufe Verstärkung", reply: "Plot Twist: Die Verstärkung trifft auch nicht." },
          { label: "Ich akzeptiere meine Niederlage", reply: "Charakterentwicklung. Stark." }
        ]
      },
      {
        title: "Ende 😈",
        text: "Du hast den Test bestanden. Also fast. Eigentlich nicht. Aber du warst dabei.",
        answers: [
          { label: "Okay, ich nehme das", reply: "Sehr erwachsen von dir." },
          { label: "Ich will Revanche", reply: "Lade die Seite neu. Der Button wartet schon." }
        ]
      }
    ];

    function moveButton() {
      escapes++;

      const padding = 20;
      const maxX = window.innerWidth - btn.offsetWidth - padding;
      const maxY = window.innerHeight - btn.offsetHeight - padding;
      const x = Math.random() * maxX + padding / 2;
      const y = Math.random() * maxY + padding / 2;

      btn.style.left = `${x}px`;
      btn.style.top = `${y}px`;

      if (escapes === 8) {
        showIntroPopup();
      }
    }

    function showIntroPopup() {
      popup.style.display = "flex";
      btn.style.display = "none";
      questionIndex = -1;
      questionTitle.textContent = "Ja, ich weiß…";
      questionText.textContent = "Du hast nie getroffen. Nicht einmal knapp. Aber hey, ich fühle dich.";
      choices.innerHTML = "";
      answerText.textContent = "";
      nextButton.style.display = "inline-block";
      nextButton.textContent = "Weiter";
    }

    function showQuestion() {
      questionIndex++;
      const q = questions[questionIndex];

      questionTitle.textContent = q.title;
      questionText.textContent = q.text;
      choices.innerHTML = "";
      answerText.textContent = "";
      nextButton.style.display = "none";

      q.answers.forEach(answer => {
        const choice = document.createElement("button");
        choice.textContent = answer.label;
        choice.addEventListener("click", () => {
          answerText.textContent = answer.reply;
          nextButton.style.display = "inline-block";
          nextButton.textContent = questionIndex === questions.length - 1 ? "Nochmal spielen" : "Weiter";
        });
        choices.appendChild(choice);
      });
    }

    nextButton.addEventListener("click", () => {
      if (questionIndex >= questions.length - 1) {
        location.reload();
      } else {
        showQuestion();
      }
    });

    btn.addEventListener("mouseenter", moveButton);
    btn.addEventListener("touchstart", moveButton);
    btn.addEventListener("click", showIntroPopup);
  </script>
</body>
</html>
