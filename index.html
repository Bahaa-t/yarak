
<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ULTRA Anti-Bot Test</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
overflow:hidden;
font-family:Arial,sans-serif;
background:black;
color:white;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
}

body::before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at top,#ff0055 0%,transparent 30%),
radial-gradient(circle at bottom,#7c3aed 0%,transparent 35%);
opacity:.35;
animation:bgmove 8s linear infinite alternate;
}

@keyframes bgmove{
from{transform:scale(1)}
to{transform:scale(1.1)}
}

.container{
position:relative;
z-index:2;
width:min(90vw,900px);
}

h1{
font-size:clamp(38px,7vw,88px);
margin-bottom:10px;
}

p{
font-size:22px;
opacity:.85;
}

#btn{
position:absolute;
left:50%;
top:65%;
transform:translate(-50%,-50%);
padding:20px 34px;
border:none;
border-radius:999px;
font-size:24px;
font-weight:bold;
cursor:pointer;
background:white;
color:black;
transition:.12s;
z-index:5;
}

#btn:hover{
transform:translate(-50%,-50%) scale(1.1) rotate(-6deg);
}

.popup{
position:fixed;
inset:0;
background:rgba(0,0,0,.82);
display:none;
justify-content:center;
align-items:center;
z-index:20;
padding:20px;
}

.card{
width:min(95vw,650px);
background:white;
color:black;
padding:30px;
border-radius:30px;
box-shadow:0 0 80px rgba(255,0,80,.5);
animation:pop .25s ease;
}

@keyframes pop{
from{transform:scale(.7);opacity:0}
to{transform:scale(1);opacity:1}
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:20px;
}

.tile{
aspect-ratio:1;
border-radius:18px;
background:#ddd;
display:flex;
justify-content:center;
align-items:center;
font-size:42px;
cursor:pointer;
transition:.15s;
user-select:none;
}

.tile:hover{
transform:scale(1.05);
}

.tile.selected{
background:#7c3aed;
color:white;
transform:scale(.92);
}

button.action{
margin-top:20px;
padding:15px 22px;
border:none;
border-radius:16px;
background:#ff0055;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

#message{
margin-top:16px;
font-weight:bold;
font-size:18px;
min-height:30px;
color:#7c3aed;
}

#finalHack{
position:fixed;
inset:0;
background:black;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:999;
font-family:monospace;
}

.glitch{
font-size:clamp(30px,6vw,80px);
color:#ff0033;
animation:glitch .08s infinite alternate;
}

@keyframes glitch{
from{transform:translateX(-3px)}
to{transform:translateX(3px)}
}

.scan{
position:fixed;
inset:0;
background:repeating-linear-gradient(
to bottom,
rgba(255,255,255,.03),
rgba(255,255,255,.03) 2px,
transparent 2px,
transparent 4px
);
pointer-events:none;
z-index:9999;
}

.fakecursor{
position:fixed;
width:20px;
height:20px;
border:2px solid white;
border-radius:50%;
pointer-events:none;
animation:explode .7s ease forwards;
z-index:999;
}

@keyframes explode{
to{
transform:scale(4);
opacity:0;
}
}

input{
width:100%;
padding:16px;
font-size:22px;
border-radius:16px;
border:2px solid #ccc;
margin-top:16px;
text-align:center;
}

.shake{
animation:shake .15s linear 4;
}

@keyframes shake{
0%,100%{transform:translateX(0)}
25%{transform:translateX(-10px)}
75%{transform:translateX(10px)}
}
</style>
</head>

<body>

<div class="scan"></div>

<div class="container">
<h1>ANTI-BOT TEST</h1>
<p>Beweise, dass du kein Bot bist.</p>
</div>

<button id="btn">Ich bin kein Bot</button>

<div class="popup" id="popup">
<div class="card" id="card">
<h2 id="title">Captcha Prüfung</h2>
<p id="desc">Klicke alle Bilder mit echten Menschen an.</p>

<div id="content"></div>

<div id="message"></div>

<button class="action" id="next">Weiter</button>
</div>
</div>

<div id="finalHack">
<div class="glitch">BOTS GEHACKT</div>
<p>System kompromittiert...</p>
<p>IP wird an NASA geschickt...</p>
<p>Bitte nicht Browser schließen...</p>
</div>

<script>

const btn=document.getElementById("btn");
const popup=document.getElementById("popup");
const content=document.getElementById("content");
const message=document.getElementById("message");
const next=document.getElementById("next");
const title=document.getElementById("title");
const desc=document.getElementById("desc");
const card=document.getElementById("card");
const finalHack=document.getElementById("finalHack");

let stage=-1;
let escapes=0;

const stages=[
{
type:"captcha",
title:"Google Ultra Secure Captcha",
desc:"Klicke alle echten Menschen an.",
tiles:["🤖","🧍","🤖","🧍","🤖","🤖","🧍","🤖","🤖"]
},
{
type:"captcha",
title:"Sicherheitsprüfung 2",
desc:"Klicke alle Busse an.",
tiles:["🚌","🚗","🚲","🚌","🚓","🚗","🚕","🚌","🚑"]
},
{
type:"age"
},
{
type:"choice"
}
];

function moveButton(){
escapes++;

const x=Math.random()*(window.innerWidth-btn.offsetWidth-40);
const y=Math.random()*(window.innerHeight-btn.offsetHeight-40);

btn.style.left=x+"px";
btn.style.top=y+"px";

if(escapes>8){
openPopup();
}
}

btn.addEventListener("mouseenter",moveButton);
btn.addEventListener("click",moveButton);

function fakeClicks(){
const c=document.createElement("div");
c.className="fakecursor";
c.style.left=Math.random()*window.innerWidth+"px";
c.style.top=Math.random()*window.innerHeight+"px";
document.body.appendChild(c);
setTimeout(()=>c.remove(),700);
}

setInterval(fakeClicks,800);

function openPopup(){
popup.style.display="flex";
btn.style.display="none";
next.style.display="none";
stage=-1;
loadStage();
}

function loadStage(){
stage++;
message.textContent="";
content.innerHTML="";
next.style.display="none";

const s=stages[stage];

if(s.type==="captcha"){
title.textContent=s.title;
desc.textContent=s.desc;

const grid=document.createElement("div");
grid.className="grid";

s.tiles.forEach(item=>{
const tile=document.createElement("div");
tile.className="tile";
tile.textContent=item;

tile.onclick=()=>{
tile.classList.toggle("selected");
};

grid.appendChild(tile);
});

content.appendChild(grid);

const verify=document.createElement("button");
verify.className="action";
verify.textContent="Bestätigen";

verify.onclick=()=>{
card.classList.add("shake");

setTimeout(()=>card.classList.remove("shake"),700);

message.textContent="Falsch. Verdächtiges Bot-Verhalten erkannt.";

next.style.display="inline-block";
};

content.appendChild(verify);
}

if(s.type==="age"){
title.textContent="Altersprüfung";
desc.textContent="Gib dein echtes Alter ein. Hinweis: Die richtige Antwort ist 30.";

const input=document.createElement("input");
input.placeholder="Alter";

const verify=document.createElement("button");
verify.className="action";
verify.textContent="Prüfen";

verify.onclick=()=>{
if(input.value==="30"){
message.textContent="Korrekt. Du bist anscheinend 30.";
}else{
message.textContent="Falsch. Du schätzt dich zu jung.";
card.classList.add("shake");
setTimeout(()=>card.classList.remove("shake"),700);
}
next.style.display="inline-block";
};

content.appendChild(input);
content.appendChild(verify);
}

if(s.type==="choice"){
title.textContent="Menschlichkeits-Test";
desc.textContent="Was würdest du als Mensch tun?";

const answers=[
["Panik bekommen","Normale Reaktion. Trotzdem Bot."],
["Browser schließen","Zu spät."],
["So tun als wäre ich kein Bot","EXTREM verdächtig."]
];

answers.forEach(a=>{
const b=document.createElement("button");
b.className="action";
b.style.display="block";
b.style.width="100%";
b.style.marginTop="12px";
b.textContent=a[0];

b.onclick=()=>{
message.textContent=a[1];
next.style.display="inline-block";
};

content.appendChild(b);
});

next.textContent="Endauswertung";
}

if(stage>=stages.length){
startHack();
}
}

next.onclick=()=>loadStage();

function startHack(){
popup.style.display="none";
finalHack.style.display="flex";

let texts=[
"BOT ERKANNT...",
"SYSTEM INFIZIERT...",
"ALLE DATEN WERDEN HOCHGELADEN...",
"DISCORD TOKEN GEFUNDEN...",
"MUTTER WIRD KONTAKTIERT...",
"ZU SPÄT..."
];

let i=0;

const interval=setInterval(()=>{
document.querySelector(".glitch").textContent=texts[i%texts.length];
i++;

if(i>12){
clearInterval(interval);

setTimeout(()=>{
alert("Spaß 😈 Du bist offiziell ein Bot.");
location.reload();
},2000);
}

},900);
}

</script>

</body>
</html>
