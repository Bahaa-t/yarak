
<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valorant Aim Trainer 😭</title>

<style>

*{box-sizing:border-box}

body{
margin:0;
overflow:hidden;
height:100vh;
font-family:Arial,sans-serif;
background:
radial-gradient(circle at top,#ff4655 0%,transparent 35%),
#0f1118;
color:white;
cursor:crosshair;
}

#hud{
position:fixed;
top:20px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:20px;
font-size:22px;
font-weight:bold;
z-index:10;
}

.box{
background:rgba(255,255,255,.08);
padding:12px 20px;
border-radius:16px;
backdrop-filter:blur(8px);
}

#game{
position:relative;
width:100%;
height:100%;
overflow:hidden;
}

.target{
position:absolute;
width:90px;
height:90px;
border-radius:50%;
background:
radial-gradient(circle at 30% 30%,white,#ff4655 55%,#4d0d12);
box-shadow:0 0 40px rgba(255,70,85,.7);
display:flex;
justify-content:center;
align-items:center;
font-size:34px;
cursor:pointer;
user-select:none;
transition:.08s linear;
}

.target:hover{
transform:scale(1.05);
}

.hit{
animation:hit .2s ease;
}

@keyframes hit{
0%{transform:scale(1)}
50%{transform:scale(.8)}
100%{transform:scale(1)}
}

#overlay{
position:fixed;
inset:0;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
background:rgba(0,0,0,.88);
z-index:20;
text-align:center;
}

#overlay h1{
font-size:clamp(40px,8vw,100px);
margin-bottom:10px;
color:#ff4655;
}

#overlay p{
font-size:24px;
opacity:.9;
}

#startBtn{
margin-top:20px;
padding:18px 30px;
border:none;
border-radius:18px;
background:#ff4655;
color:white;
font-size:22px;
font-weight:bold;
cursor:pointer;
}

#crash{
position:fixed;
inset:0;
background:black;
display:none;
z-index:999;
overflow:hidden;
}

.glitch{
position:absolute;
top:18%;
left:50%;
transform:translateX(-50%);
font-size:clamp(44px,9vw,110px);
font-weight:bold;
color:#ff003c;
animation:glitch .07s infinite alternate;
text-shadow:4px 0 cyan;
}

@keyframes glitch{
from{transform:translateX(-50%) translate(-4px,2px)}
to{transform:translateX(-50%) translate(4px,-2px)}
}

#terminal{
position:absolute;
top:42%;
left:50%;
transform:translateX(-50%);
width:min(92vw,760px);
font-family:Consolas,monospace;
font-size:19px;
line-height:1.7;
color:#00ff88;
}

.scan{
position:absolute;
inset:0;
background:repeating-linear-gradient(
to bottom,
rgba(255,255,255,.04),
rgba(255,255,255,.04) 2px,
transparent 2px,
transparent 5px
);
animation:flicker .08s infinite alternate;
pointer-events:none;
}

@keyframes flicker{
from{opacity:.25}
to{opacity:.55}
}

.fakeLag{
animation:lag .06s linear infinite;
}

@keyframes lag{
0%{transform:translate(0)}
25%{transform:translate(-4px,2px)}
50%{transform:translate(4px,-2px)}
75%{transform:translate(-2px,-3px)}
100%{transform:translate(0)}
}

</style>
</head>

<body>

<div id="hud">
<div class="box">Kills: <span id="kills">0</span></div>
<div class="box">Misses: <span id="misses">0</span></div>
<div class="box">Rank: <span id="rank">Radiant?</span></div>
<div class="box">Ping: <span id="ping">21</span>ms</div>
</div>

<div id="game"></div>

<div id="overlay">
<h1>VALORANT AIM TRAINER</h1>
<p>Beweise, dass du kein Iron-Spieler bist 😭</p>
<button id="startBtn">MATCH STARTEN</button>
</div>

<div id="crash">
<div class="scan"></div>
<div class="glitch">SKILL ISSUE ERKANNT</div>
<div id="terminal"></div>
</div>

<script>

const game=document.getElementById("game");
const overlay=document.getElementById("overlay");
const startBtn=document.getElementById("startBtn");

const killsText=document.getElementById("kills");
const missesText=document.getElementById("misses");
const rankText=document.getElementById("rank");
const pingText=document.getElementById("ping");

const crash=document.getElementById("crash");
const terminal=document.getElementById("terminal");

let kills=0;
let misses=0;
let ping=21;
let started=false;

const ranks=[
"Iron 1 😭",
"Iron 2 😭",
"Bronze Bot",
"Plastic 4",
"Cardboard Elite"
];

function randomPos(target){

const x=Math.random()*(window.innerWidth-120);
const y=Math.random()*(window.innerHeight-120);

target.style.left=x+"px";
target.style.top=y+"px";
}

function createTarget(){

if(!started) return;

const target=document.createElement("div");
target.className="target";
target.innerHTML="🎯";

randomPos(target);

game.appendChild(target);

let escaped=false;

const move=setInterval(()=>{

randomPos(target);

if(Math.random()>.65){
document.body.classList.add("fakeLag");
setTimeout(()=>document.body.classList.remove("fakeLag"),120);
}

},700);

target.onclick=(e)=>{

e.stopPropagation();

kills++;

killsText.textContent=kills;

target.classList.add("hit");

clearInterval(move);

setTimeout(()=>{
target.remove();
},120);

if(kills<15){
setTimeout(createTarget,350);
}else{
endGame();
}

};

setTimeout(()=>{

if(document.body.contains(target)){

escaped=true;
misses++;

missesText.textContent=misses;

rankText.textContent=ranks[Math.min(misses,ranks.length-1)];

target.remove();

clearInterval(move);

if(started){
setTimeout(createTarget,300);
}

}

},2200);

}

document.body.addEventListener("click",(e)=>{

if(!e.target.classList.contains("target") && started){

misses++;

missesText.textContent=misses;

if(misses>2){
rankText.textContent="Iron 1 😭";
}

}

});

function fakePing(){

setInterval(()=>{

if(!started) return;

ping=Math.floor(Math.random()*900)+20;

pingText.textContent=ping;

if(ping>700){
rankText.textContent="Lag detected 😭";
}

},1200);

}

startBtn.onclick=()=>{

overlay.style.display="none";
started=true;

fakePing();

createTarget();

};

function endGame(){

started=false;

setTimeout(()=>{

crash.style.display="block";

const lines=[
"> Vanguard gestartet...",
"> Aim wird analysiert...",
"> Trefferquote katastrophal...",
"> Verdächtiger Iron-Spieler erkannt...",
"> Mausbewegungen sehen illegal schlecht aus...",
"> Radiant verweigert...",
"> Discord Token gefunden...",
"> Fortnite-Skins gelöscht...",
"> Ergebnis: DU WIRST NIE RADIANT 😭"
];

let i=0;

const inter=setInterval(()=>{

terminal.innerHTML+=lines[i]+"<br>";

i++;

if(i>=lines.length){

clearInterval(inter);

setTimeout(()=>{
terminal.innerHTML+="<br><br>SPAß 😭";
},1500);

}

},700);

},1200);

}

</script>

</body>
</html>
